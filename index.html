/* Direction : une copie double — grands carreaux Seyès en fond, marge rouge, compte à rebours écrit au stylo bleu. */
:root {
  --papier: #f6f8fc;
  --feuille: #ffffff;
  --encre: #18233f;
  --encre-2: #4c5875;
  --encre-3: #66718c;
  --ligne: #e4eaf5;
  --ligne-forte: #cfd9ec;
  --marge: #ee95a4;
  --bic: #5b3fd0;
  --sur-bic: #ffffff;
  --bic-doux: #eeeafd;
  --rouge: #c8243a;
  --rouge-doux: #fdecef;
  --vert: #1e7a4c;
  --vert-doux: #e6f4ec;
  --orange: #a65e00;
  --orange-doux: #fdf1dc;
  --ombre: 0 1px 0 rgba(24, 35, 63, .04), 0 10px 28px -18px rgba(24, 35, 63, .35);

  /* graphiques (palette validée) */
  --s-maths: #2a78d6; --s-pct: #eb6834; --s-svt: #1baf7a; --s-francais: #eda100; --s-anglais: #e87ba4; --s-hg: #008300; --s-philo: #e34948;
  --barre: #2a78d6; --barre-part: #86b6ef;
  --tk1: #ec9979; --tk2: #db754b; --tk3: #c5521c; --tk4: #a43700; --tk5: #7d2600;
  --st-bon: #0ca30c; --st-moyen: #fab219; --st-faible: #d03b3b; --st-aucun: #c3cad8;
  --grille: #e6eaf2; --axe: #c6cddb;

  --f-display: "Kalam", "Segoe Print", "Bradley Hand", cursive;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --t-xs: .8125rem; --t-s: .875rem; --t-m: 1rem; --t-l: 1.1875rem; --t-xl: 1.5rem; --t-xxl: 2.125rem;
  --r: 14px; --r-s: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #0c1220; --feuille: #141d31; --encre: #e6ecf8; --encre-2: #b5bfd5; --encre-3: #929db6;
    --ligne: #172036; --ligne-forte: #26324d; --marge: #6e2f3d;
    --bic: #a593ff; --sur-bic: #0c1220; --bic-doux: #221c45;
    --rouge: #ff7a88; --rouge-doux: #3a1a24; --vert: #4cc38a; --vert-doux: #14301f; --orange: #f0a040; --orange-doux: #35270f;
    --ombre: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.8);
    --s-maths: #3987e5; --s-pct: #d95926; --s-svt: #199e70; --s-francais: #c98500; --s-anglais: #d55181; --s-hg: #0ca30c; --s-philo: #e66767;
    --barre: #5598e7; --barre-part: #1f5cab;
    --tk1: #824121; --tk2: #ae5528; --tk3: #d86d38; --tk4: #f19266; --tk5: #ffbc9d;
    --st-aucun: #3a4560; --grille: #1f2940; --axe: #334061;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #0c1220; --feuille: #141d31; --encre: #e6ecf8; --encre-2: #b5bfd5; --encre-3: #929db6;
  --ligne: #172036; --ligne-forte: #26324d; --marge: #6e2f3d;
  --bic: #a593ff; --sur-bic: #0c1220; --bic-doux: #221c45;
  --rouge: #ff7a88; --rouge-doux: #3a1a24; --vert: #4cc38a; --vert-doux: #14301f; --orange: #f0a040; --orange-doux: #35270f;
  --ombre: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.8);
  --s-maths: #3987e5; --s-pct: #d95926; --s-svt: #199e70; --s-francais: #c98500; --s-anglais: #d55181; --s-hg: #0ca30c; --s-philo: #e66767;
  --barre: #5598e7; --barre-part: #1f5cab;
  --tk1: #824121; --tk2: #ae5528; --tk3: #d86d38; --tk4: #f19266; --tk5: #ffbc9d;
  --st-aucun: #3a4560; --grille: #1f2940; --axe: #334061;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--f-body);
  font-size: var(--t-m);
  line-height: 1.45;
  color: var(--encre);
  background-color: var(--papier);
  background-image:
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--ligne-forte) 31px 32px),
    repeating-linear-gradient(to bottom, transparent 0 7px, var(--ligne) 7px 8px),
    repeating-linear-gradient(to right, transparent 0 31px, var(--ligne) 31px 32px);
  background-attachment: fixed;
  -webkit-text-size-adjust: 100%;
}
.marge-rouge { position: fixed; top: 0; bottom: 0; left: 9px; width: 2px; background: var(--marge); opacity: .75; pointer-events: none; z-index: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
a { color: var(--bic); }
:focus-visible { outline: 3px solid var(--bic); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- Coquille ---------- */
.app { position: relative; z-index: 1; min-height: 100%; }
.main { padding: 18px 16px 104px 22px; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: color-mix(in srgb, var(--feuille) 94%, transparent);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--ligne-forte);
  padding: 6px 6px 8px;
}
.nav a {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  text-decoration: none; color: var(--encre-2); font-size: var(--t-xs); padding: 6px 2px; border-radius: 10px;
}
.nav a svg { width: 24px; height: 24px; }
.nav a[aria-current="page"] { color: var(--bic); font-weight: 700; background: var(--bic-doux); }
.nav .marque { display: none; }

@media (min-width: 960px) {
  .marge-rouge { left: 236px; }
  .nav {
    top: 0; bottom: 0; right: auto; width: 228px; display: flex; flex-direction: column; gap: 4px;
    border-top: 0; border-right: 1px solid var(--ligne-forte); padding: 22px 14px;
    background: var(--feuille);
  }
  .nav .marque { display: block; font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; color: var(--bic); padding: 0 10px 18px; line-height: 1.1; }
  .nav .marque small { display: block; font-family: var(--f-body); font-weight: 400; font-size: var(--t-xs); color: var(--encre-2); margin-top: 4px; }
  .nav a { flex-direction: row; gap: 12px; font-size: var(--t-m); padding: 10px 12px; }
  .main { margin-left: 260px; margin-right: auto; max-width: 1120px; padding: 32px 32px 48px; width: calc(100% - 260px); }
}

/* ---------- Éléments ---------- */
.carte {
  background: var(--feuille); border: 1px solid var(--ligne-forte); border-radius: var(--r);
  box-shadow: var(--ombre); padding: 16px;
}
.carte > * + * { margin-top: 12px; }
.carte-titre { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.carte-titre h2, .h2 { font-size: var(--t-l); font-weight: 700; }
.sous { color: var(--encre-2); font-size: var(--t-s); }
.petit { font-size: var(--t-xs); color: var(--encre-2); }
.page-titre { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.page-titre h1 { font-size: var(--t-xxl); font-family: var(--f-display); font-weight: 700; color: var(--encre); line-height: 1.05; }
.page-titre p { color: var(--encre-2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--ligne-forte);
  background: var(--feuille); color: var(--encre); font-weight: 700; cursor: pointer; text-align: center;
  transition: transform .08s ease, background-color .15s ease;
}
.btn:hover { background: var(--bic-doux); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.primaire { background: var(--bic); color: var(--sur-bic); border-color: var(--bic); }
.btn.primaire:hover { filter: brightness(1.06); }
.btn.grand { min-height: 56px; font-size: var(--t-l); border-radius: 14px; width: 100%; }
.btn.fantome { background: transparent; border-color: transparent; color: var(--bic); }
.btn.fantome:hover { background: var(--bic-doux); }
.btn.danger { color: var(--rouge); }
.btn.ok { background: var(--vert); border-color: var(--vert); color: #fff; }
:root[data-theme="dark"] .btn.ok { color: #0c1220; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.ok { color: #0c1220; } }
.btn.non { color: var(--rouge); border-color: color-mix(in srgb, var(--rouge) 45%, var(--ligne-forte)); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.petit-btn { min-height: 36px; padding: 6px 12px; font-size: var(--t-s); }
.rangee { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.rangee.etire > * { flex: 1 1 0; }
.pile { display: flex; flex-direction: column; gap: 10px; }

.puce {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  font-size: var(--t-xs); font-weight: 700; border: 1px solid var(--ligne-forte); background: var(--feuille); color: var(--encre-2);
  white-space: nowrap;
}
.puce.bic { background: var(--bic-doux); color: var(--bic); border-color: transparent; }
.puce.bac { background: var(--bic); color: var(--sur-bic); border-color: transparent; }
.puce.hors { background: transparent; color: var(--encre-3); border-style: dashed; }
.puce .pt { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.puces { display: flex; gap: 8px; flex-wrap: wrap; }

.choix { display: flex; flex-wrap: wrap; gap: 8px; }
.choix button {
  min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--ligne-forte);
  background: var(--feuille); cursor: pointer; font-size: var(--t-s); font-weight: 700; color: var(--encre-2);
}
.choix button[aria-pressed="true"] { background: var(--bic); color: var(--sur-bic); border-color: var(--bic); }

.bandeau { border-radius: var(--r-s); padding: 10px 14px; font-size: var(--t-s); display: flex; gap: 10px; align-items: flex-start; }
.bandeau svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.bandeau.info { background: var(--bic-doux); color: var(--encre); }
.bandeau.alerte { background: var(--orange-doux); color: var(--encre); }
.bandeau.erreur { background: var(--rouge-doux); color: var(--encre); }

label.champ { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: var(--t-s); }
label.champ .aide { font-weight: 400; color: var(--encre-2); }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--ligne-forte);
  background: var(--feuille); color: var(--encre);
}
textarea { min-height: 160px; resize: vertical; line-height: 1.5; }
textarea.copie {
  min-height: 260px; padding: 12px 14px 12px 22px; line-height: 32px;
  background-image: linear-gradient(to right, transparent 12px, var(--marge) 12px 14px, transparent 14px),
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--ligne-forte) 31px 32px);
  background-attachment: local;
}
.case { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
.case input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--bic); }

/* ---------- Ce soir ---------- */
.entete { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.date-du-jour { font-size: var(--t-s); color: var(--encre-2); }
.date-du-jour::first-letter, .journal .jd::first-letter { text-transform: uppercase; }
.salut { font-size: var(--t-xl); font-weight: 700; }
.etat-sync { font-size: var(--t-xs); color: var(--encre-3); display: inline-flex; align-items: center; gap: 6px; }
.etat-sync .pt { width: 8px; height: 8px; border-radius: 50%; background: var(--st-aucun); }
.etat-sync.ok .pt { background: var(--st-bon); }
.etat-sync.lent .pt { background: var(--st-moyen); }

.hero { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 4px 0 0; }
.compte {
  font-family: var(--f-display); font-weight: 700; color: var(--bic);
  font-size: clamp(3.6rem, 17vw, 5.6rem); line-height: .95; letter-spacing: -.01em;
  transform: rotate(-2deg); transform-origin: left bottom; display: inline-block;
}
.compte-sous { color: var(--encre-2); font-size: var(--t-s); margin-top: 6px; }
.compte-sous strong { color: var(--encre); }
.trait { display: block; height: 10px; width: min(220px, 70%); margin-top: 2px; }
.anneau { position: relative; width: 128px; height: 128px; }
.anneau svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.anneau .val { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.anneau .val b { font-size: 1.75rem; line-height: 1; }
.anneau .val span { font-size: var(--t-xs); color: var(--encre-2); }

.semaine { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.semaine .j { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: var(--t-xs); color: var(--encre-2); }
.semaine .rond { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ligne-forte); background: var(--feuille); }
.semaine .rond.part { background: linear-gradient(to top, var(--barre-part) 50%, var(--feuille) 50%); border-color: var(--barre-part); }
.semaine .rond.plein { background: var(--barre); border-color: var(--barre); }
.semaine .j.auj .rond { outline: 2px solid var(--bic); outline-offset: 2px; }
.serie { display: flex; gap: 16px; flex-wrap: wrap; font-size: var(--t-s); color: var(--encre-2); }
.serie b { color: var(--encre); font-size: var(--t-l); }

.mot { border-left: 4px solid var(--marge); background: var(--feuille); }
.mot .mot-txt { font-family: var(--f-display); font-size: 1.3rem; line-height: 1.35; color: var(--encre); white-space: pre-wrap; }

.plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.plan li { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px dashed var(--ligne-forte); }
.plan li:first-child { border-top: 0; }
.plan .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--bic-doux); color: var(--bic); display: grid; place-items: center; }
.plan .ico svg { width: 20px; height: 20px; }
.plan .lbl b { display: block; }
.plan .lbl span { font-size: var(--t-s); color: var(--encre-2); }
.plan .min { font-weight: 700; color: var(--encre-2); font-size: var(--t-s); }
.plan li.fait .lbl b { text-decoration: line-through; text-decoration-color: var(--rouge); }

.raccourcis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.raccourci { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; padding: 12px; min-height: 76px; border-radius: 12px; border: 1px solid var(--ligne-forte); background: var(--feuille); cursor: pointer; }
.raccourci:hover { background: var(--bic-doux); }
.raccourci svg { width: 22px; height: 22px; color: var(--bic); }
.raccourci b { font-size: var(--t-s); }
.raccourci span { font-size: var(--t-xs); color: var(--encre-2); }

/* ---------- Réviser ---------- */
.methodes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 700px) { .methodes { grid-template-columns: repeat(3, 1fr); } }
.methode { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 14px; border-radius: var(--r); border: 1px solid var(--ligne-forte); background: var(--feuille); box-shadow: var(--ombre); cursor: pointer; min-height: 128px; }
.methode:hover { border-color: var(--bic); }
.methode .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--bic-doux); color: var(--bic); }
.methode .ico svg { width: 22px; height: 22px; }
.methode b { font-size: var(--t-m); }
.methode span { font-size: var(--t-xs); color: var(--encre-2); }
.methode .meta { margin-top: auto; font-weight: 700; color: var(--bic); font-size: var(--t-xs); }

.liste-chap { display: flex; flex-direction: column; }
.liste-chap .groupe { font-size: var(--t-xs); font-weight: 700; color: var(--encre-3); text-transform: uppercase; letter-spacing: .06em; padding: 14px 0 6px; }
.chap { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--ligne); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.chap:hover { background: var(--bic-doux); }
.chap .t { font-weight: 700; font-size: var(--t-s); }
.chap .s { font-size: var(--t-xs); color: var(--encre-2); }
.maitrise { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs); font-weight: 700; color: var(--encre-2); white-space: nowrap; }
.maitrise .pt { width: 12px; height: 12px; border-radius: 4px; background: var(--st-aucun); flex: none; }
.maitrise.m1 .pt { background: var(--st-faible); }
.maitrise.m2 .pt { background: var(--st-moyen); }
.maitrise.m3 .pt { background: var(--st-bon); }
.jauge { height: 6px; border-radius: 3px; background: var(--ligne); overflow: hidden; width: 64px; }
.jauge i { display: block; height: 100%; background: var(--barre); border-radius: 3px; }

.segment { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.segment button { min-height: 52px; border-radius: 10px; border: 1px solid var(--ligne-forte); background: var(--feuille); cursor: pointer; font-size: var(--t-xs); font-weight: 700; color: var(--encre-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px 4px; }
.segment button .pt { width: 12px; height: 12px; border-radius: 4px; background: var(--st-aucun); }
.segment button[data-m="1"] .pt { background: var(--st-faible); }
.segment button[data-m="2"] .pt { background: var(--st-moyen); }
.segment button[data-m="3"] .pt { background: var(--st-bon); }
.segment button[aria-pressed="true"] { border-color: var(--bic); box-shadow: inset 0 0 0 2px var(--bic); color: var(--encre); }

/* ---------- Feuille (overlay) ---------- */
.voile { position: fixed; inset: 0; background: rgba(12, 18, 32, .45); z-index: 40; display: flex; align-items: stretch; justify-content: center; }
.feuille {
  position: relative; background: var(--papier); width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden;
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--ligne) 31px 32px);
}
@media (min-width: 760px) {
  .voile { align-items: center; padding: 24px; }
  .feuille { max-width: 760px; height: auto; max-height: calc(100% - 48px); border-radius: 18px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.5); }
}
.feuille-tete { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 20px; border-bottom: 1px solid var(--ligne-forte); background: var(--feuille); }
.feuille-tete h2 { font-size: var(--t-l); flex: 1; }
.feuille-tete .fermer { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--ligne-forte); background: var(--feuille); cursor: pointer; display: grid; place-items: center; }
.feuille-tete .fermer svg { width: 20px; height: 20px; }
.feuille-corps { overflow-y: auto; padding: 18px 16px 32px 22px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.feuille-pied { padding: 12px 16px; border-top: 1px solid var(--ligne-forte); background: var(--feuille); display: flex; gap: 10px; flex-wrap: wrap; }
.feuille-pied > .btn { flex: 1 1 140px; }
.chrono-barre { display: flex; align-items: center; gap: 12px; padding: 8px 20px; background: var(--feuille); border-bottom: 1px solid var(--ligne); font-size: var(--t-s); }
.chrono-barre .temps { font-weight: 700; font-variant-numeric: tabular-nums; }
.chrono-barre .barre { flex: 1; height: 8px; border-radius: 4px; background: var(--ligne); overflow: hidden; }
.chrono-barre .barre i { display: block; height: 100%; background: var(--bic); border-radius: 4px; transition: width .5s linear; }
.etapes { display: flex; gap: 6px; flex-wrap: wrap; }
.etapes span { font-size: var(--t-xs); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--ligne-forte); color: var(--encre-2); background: var(--feuille); }
.etapes span.encours { background: var(--bic); color: var(--sur-bic); border-color: var(--bic); }
.etapes span.fini { text-decoration: line-through; }
.pause-zone { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 28px 0 8px; }
.pause-temps { font-family: var(--f-display); font-size: 4.5rem; font-weight: 700; line-height: 1; color: var(--bic); }
.pause-temps.depasse { color: var(--rouge); }
.pause-msg { max-width: 34ch; font-size: var(--t-l); }
.fin-bloc { position: sticky; top: 0; z-index: 2; }
.plan li.pause { padding: 4px 0; border-top: 0; }
.plan li.pause .ico { background: transparent; color: var(--encre-3); }
.plan li.pause .lbl, .plan li.pause .min { font-size: var(--t-xs); color: var(--encre-3); font-weight: 400; }

/* cartes mémoire */
.flash { min-height: 230px; display: flex; flex-direction: column; gap: 14px; justify-content: center; padding: 22px 18px; border-radius: 16px; background: var(--feuille); border: 1px solid var(--ligne-forte); box-shadow: var(--ombre); }
.flash .q { font-size: 1.45rem; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.flash .r { font-size: var(--t-m); line-height: 1.55; border-top: 1px dashed var(--ligne-forte); padding-top: 14px; }
.compteur { display: flex; justify-content: space-between; font-size: var(--t-s); color: var(--encre-2); }

.sujet { background: var(--feuille); border: 1px solid var(--ligne-forte); border-left: 4px solid var(--marge); border-radius: 12px; padding: 14px 16px; }
.sujet .t { font-size: var(--t-l); font-weight: 700; line-height: 1.3; }
details.repli { border: 1px solid var(--ligne-forte); border-radius: 12px; background: var(--feuille); padding: 0 14px; }
details.repli summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 700; }
details.repli[open] { padding-bottom: 12px; }
details.repli ol, details.repli ul { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

.retour { display: flex; flex-direction: column; gap: 12px; }
.retour .note { font-family: var(--f-display); font-weight: 700; color: var(--rouge); font-size: 2.6rem; line-height: 1; transform: rotate(-4deg); display: inline-block; }
.retour h3 { font-size: var(--t-m); }
.retour ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

.qcm { display: flex; flex-direction: column; gap: 8px; }
.qcm button { text-align: left; min-height: 52px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--ligne-forte); background: var(--feuille); cursor: pointer; line-height: 1.4; }
.qcm button.bon { border-color: var(--vert); background: var(--vert-doux); }
.qcm button.mauvais { border-color: var(--rouge); background: var(--rouge-doux); }
.qcm.dates { display: grid; grid-template-columns: 1fr 1fr; }
.qcm.dates button { text-align: center; font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.flash.quiz-q { min-height: 150px; }
.flash.quiz-q .q { font-size: 1.2rem; }
input.saisie-quiz { font-size: 1.35rem; font-weight: 700; text-align: center; min-height: 56px; }
input.saisie-quiz.bon { border-color: var(--vert); background: var(--vert-doux); }
input.saisie-quiz.mauvais { border-color: var(--rouge); background: var(--rouge-doux); }
.retour-q { line-height: 1.5; }

        { q: "2. Factorise f(x).",
          corrige: "f(x) = a(x − x_{1})(x − x_{2}) = 2(x + 1)(x − @frac{5}{2}) = **(x + 1)(2x − 5)**.\nVérification : (x + 1)(2x − 5) = 2x² − 5x + 2x − 5 = 2x² − 3x − 5. ✔" },
        { q: "3. Résous l’inéquation f(x) > 0.",

        { q: "4. Résous l’inéquation @frac{2x² − 3x − 5}{x − 1} ≤ 0.", indice: "Tableau de signes avec trois lignes : (x + 1)(2x − 5), puis x − 1, puis le quotient. Valeur interdite : 1.",
          corrige: "Valeurs importantes : −1, 1 (interdite) et @frac{5}{2}.\n• Numérateur : + avant −1, − entre −1 et @frac{5}{2}, + après.\n• Dénominateur x − 1 : − avant 1, + après.\n• Quotient : − sur ]−∞ ; −1[, + sur ]−1 ; 1[, − sur ]1 ; @frac{5}{2}[, + après @frac{5}{2}.\nIl est nul en −1 et en @frac{5}{2}, interdit en 1.\n**S = ]−∞ ; −1] ∪ ]1 ; @frac{5}{2}]**.",

    { id: "ma-e2", titre: "Le champ de Koffi", niveau: 1, duree: 15,

        { q: "2. Déduis-en que x et y sont les solutions d’une équation du second degré, puis trouve les dimensions.", indice: "Deux nombres de somme S et de produit P sont les racines de X² − SX + P = 0.",
          corrige: "x et y ont pour somme 17 et pour produit 60 : ce sont les racines de X² − 17X + 60 = 0.\nΔ = 289 − 240 = 49, X = @frac{17 ± 7}{2}, soit 12 et 5.\n**Le champ mesure 12 m sur 5 m**.\nVérification : 2(12 + 5) = 34 et 12 × 5 = 60. ✔",

    { id: "ma-e3", titre: "L’équation à paramètre du devoir", niveau: 3, duree: 40,
      contexte: "Pour un réel m, on considère l’équation (E) : (m − 3)x² − 2(m + 2)x + m − 5 = 0.",
      questions: [
        { q: "1. Détermine m pour que −1 soit solution de (E). Donne alors l’autre solution.", indice: "Remplace x par −1. Pour l’autre solution, utilise le produit des racines P = c/a.",
          corrige: "x = −1 : (m − 3) × 1 − 2(m + 2) × (−1) + m − 5 = m − 3 + 2m + 4 + m − 5 = 4m − 4.\n4m − 4 = 0 donne **m = 1**.\nPour m = 1 : (E) s’écrit −2x² − 6x − 4 = 0. P = @frac{c}{a} = @frac{−4}{−2} = 2, donc l’autre solution vaut @frac{2}{−1} = **−2**.\nVérification : −2 × 4 + 12 − 4 = 0. ✔" },
        { q: "2. Résous (E) dans le cas m = 3.",

        { q: "3. Pour m ≠ 3, calcule le discriminant réduit Δ’ en fonction de m.", indice: "b = −2(m + 2), donc b’ = −(m + 2). Δ’ = b’² − ac.",
          corrige: "b’ = −(m + 2). Δ’ = (m + 2)² − (m − 3)(m − 5)\n= m² + 4m + 4 − (m² − 8m + 15)\n= **12m − 11**.", type: "calcul" },
        { q: "4. Discute, selon les valeurs de m, le nombre de solutions de (E).",
          corrige: "• m < @frac{11}{12} : Δ’ < 0, **aucune solution**.\n• m = @frac{11}{12} : Δ’ = 0, **une racine double** x_{0} = @frac{−b’}{a} = @frac{m + 2}{m − 3} = −@frac{7}{5}.\n• m > @frac{11}{12} et m ≠ 3 : Δ’ > 0, **deux solutions** x = @frac{(m + 2) ± @sqrt{12m − 11}}{m − 3}.\n• m = 3 : une seule solution, x = −@frac{1}{5}." },
        { q: "5. Pour quelles valeurs de m (E) a-t-elle deux racines de signes contraires ?",
          corrige: "Il faut P = @frac{c}{a} = @frac{m − 5}{m − 3} < 0.\nTableau de signes : le quotient est négatif entre 3 et 5.\n**m ∈ ]3 ; 5[** (et alors Δ’ > 0 automatiquement)." },
        { q: "6. Pour quelles valeurs de m (E) a-t-elle deux racines distinctes strictement négatives ? strictement positives ?", indice: "Trois conditions : Δ’ > 0, P > 0, et S = −b/a = 2(m + 2)/(m − 3) de signe voulu.",
          corrige: "Δ’ > 0 : m > @frac{11}{12} (et m ≠ 3).\nP > 0 : m < 3 ou m > 5.\nS = @frac{2(m + 2)}{m − 3} : S < 0 pour −2 < m < 3, S > 0 pour m < −2 ou m > 3.\n• Deux racines strictement négatives : Δ’ > 0, P > 0, S < 0, soit **m ∈ ]@frac{11}{12} ; 3[**.\n• Deux racines strictement positives : Δ’ > 0, P > 0, S > 0, soit **m ∈ ]5 ; +∞[**.",

    { id: "ma-e4", titre: "Inéquation avec une racine carrée", niveau: 3, duree: 25,
      contexte: "On veut résoudre dans ℝ l’inéquation (I) : @sqrt{x² + 6x + 6} ≥ 2x + 1.",
      questions: [
        { q: "1. Détermine l’ensemble des réels x pour lesquels x² + 6x + 6 ≥ 0.",

        { q: "2. Premier cas : 2x + 1 < 0. Que vaut l’inéquation ? Donne les solutions de ce cas.", indice: "Une racine carrée est toujours ≥ 0 : elle est donc plus grande qu’un nombre négatif.",
          corrige: "Si 2x + 1 < 0, c’est-à-dire x < −@frac{1}{2}, alors @sqrt{x² + 6x + 6} ≥ 0 > 2x + 1 : l’inéquation est vraie dès que la racine existe.\nSolutions : x < −@frac{1}{2} et x ∈ D, soit **]−∞ ; −3 − @sqrt{3}] ∪ [−3 + @sqrt{3} ; −@frac{1}{2}[**." },

        { q: "4. Conclus : ensemble des solutions de (I).",
          corrige: "On réunit les deux cas :\n**S = ]−∞ ; −3 − @sqrt{3}] ∪ [−3 + @sqrt{3} ; @frac{5}{3}]**.",

        { q: "2. Élimine y de la dernière ligne, puis trouve z.", indice: "Combine 5 × (3y + z = 0) et 3 × (−5y + 3z = 14).",

    { id: "ma-s2", titre: "Les courses d’Afi au marché Dantokpa", niveau: 2, duree: 25,

        { q: "2. Additionne les trois équations. Qu’obtiens-tu ?", indice: "Chaque inconnue apparaît 4 fois au total.",

          retenir: "On termine toujours par une phrase qui répond à la question posée." }

    { id: "ma-s3", titre: "Système 2 × 2 avec le déterminant", niveau: 1, duree: 10,

        { q: "1. Calcule le déterminant de (S). Que peux-tu en conclure ?",

      { type: "ph-dissert", texte: "L’État est-il l’ennemi de la liberté de l’individu ?",
        modele: "**Analyse** : l’État = le pouvoir politique qui fait les lois et les fait respecter sur un territoire. La liberté de l’individu = pouvoir agir selon sa volonté. « Ennemi » : ce qui s’oppose, ce qui menace.\n**Problème** : l’État limite mes actes (lois, impôts, police)… mais sans lui, ma liberté serait-elle mieux protégée contre la force des autres ?\n\n**I. L’État semble limiter, voire menacer, la liberté de l’individu**\n• Il impose des lois, des interdits, des impôts : il contraint (Weber : le monopole de la violence physique légitime).\n• Pour Marx, il sert les intérêts d’une classe ; pour les anarchistes, il opprime par nature.\n• Exemple : les régimes dictatoriaux, la censure, les arrestations arbitraires.\n\n**II. Mais sans État, la liberté de chacun est à la merci des plus forts**\n• Hobbes : l’état de nature est une « guerre de chacun contre chacun » ; l’État apporte la sécurité, condition de toute liberté.\n• Rousseau : en entrant dans l’état civil, l’homme perd la liberté naturelle, illimitée mais fragile, et gagne la liberté civile, garantie par la loi.\n• Montesquieu : « la liberté est le droit de faire tout ce que les lois permettent ».\n\n**III. Tout dépend de l’État : l’État de droit est le garant de la liberté**\n• Un État qui protège les droits (Locke) et dont le pouvoir est limité (séparation des pouvoirs : « le pouvoir arrête le pouvoir »).\n• Un État dont le peuple est l’auteur des lois : « l’obéissance à la loi qu’on s’est prescrite est liberté » (Rousseau). Exemple : la Constitution béninoise de 1990, « la souveraineté nationale appartient au peuple ».\n\n**Conclusion** : l’État n’est pas en lui-même l’ennemi de la liberté ; il en est même la condition, à condition d’être un État de droit, contrôlé par les citoyens." },

        modele: "**Thème** : la liberté de l’homme quand il entre dans la société politique (l’état civil).\n**Thèse** : par le contrat social, l’homme ne perd pas sa liberté : il échange une liberté naturelle, illimitée mais fondée sur la force, contre une liberté civile garantie par la loi, et même une liberté morale : obéir à la loi qu’on s’est donnée, c’est être libre.\n**Problème** : en entrant dans la société et en obéissant aux lois, l’individu perd-il sa liberté ?\n\n**Structure** :\n1. Lignes 1 à 3 : le bilan du contrat social, ce que l’homme perd (liberté naturelle, droit illimité) et ce qu’il gagne (liberté civile, propriété).\n2. Lignes 3 à 7 : deux distinctions pour ne pas se tromper : liberté naturelle (limitée par la force de chacun) et liberté civile (limitée par la volonté générale) ; possession (effet de la force) et propriété (fondée sur un titre, un droit).\n3. Lignes 8 à 10 : le gain le plus important, la liberté morale : obéir à ses désirs est un esclavage, obéir à la loi qu’on s’est prescrite est la vraie liberté.\n\n**Intérêt** : le texte montre que la loi n’est pas l’ennemie de la liberté : elle la rend sûre et juste. Il fonde la démocratie : le peuple est l’auteur des lois (la Constitution béninoise : « la souveraineté nationale appartient au peuple »).\n**Limites** : et si la loi est faite par une minorité, ou si la majorité opprime une minorité (Tocqueville parlera de « tyrannie de la majorité ») ? La liberté civile suppose une vraie démocratie et le respect des droits de chacun (Locke)." }

        modele: "**Introduction** : Charles Baudelaire (1821-1867) publie Les Fleurs du mal en 1857, puis une deuxième édition en 1861 où figure « L’Albatros ». Dans ces quatre quatrains en alexandrins, il raconte comment des marins capturent un grand oiseau de mer pour s’en moquer. Nous verrons d’abord le récit d’une humiliation cruelle, puis l’allégorie du poète incompris.\n\n**I. Le récit d’une humiliation cruelle**\n• Un oiseau majestueux : les **périphrases** et **métaphores** « vastes oiseaux des mers » (v. 2), « rois de l’azur » (v. 6) soulignent sa grandeur dans le ciel.\n• Une chute brutale : sur le pont, ces oiseaux deviennent « maladroits et honteux » (v. 6) ; la **comparaison** « Comme des avirons » (v. 8) montre que ses ailes, si belles en vol, deviennent un poids ridicule.\n• La cruauté des marins : ils agissent « pour s’amuser » (v. 1) ; les exclamations et l’**antithèse** « naguère si beau, qu’il est comique et laid ! » (v. 10) traduisent le contraste entre la grandeur passée et l’humiliation présente.\n\n**II. Une allégorie du poète incompris**\n• La comparaison finale : « Le Poète est semblable au prince des nuées » (v. 13) révèle le sens du poème : l’albatros représente le poète.\n• La supériorité du poète : comme l’oiseau dans la tempête, il « se rit de l’archer » (v. 14) dans le monde de l’imagination.\n• Son exclusion dans la société : « Exilé sur le sol au milieu des huées » (v. 15), il est moqué par les hommes ordinaires ; le dernier vers, « Ses ailes de géant l’empêchent de marcher », montre que son génie le rend maladroit dans la vie quotidienne.\n\n**Conclusion** : à travers un récit simple, Baudelaire construit une allégorie : le poète, génial dans le monde de l’art, est incompris et rejeté par la foule. Cette image du poète maudit se retrouve chez Verlaine et Rimbaud." },
      { type: "fr-commentaire", texte: "Fais le commentaire composé de cette fable de La Fontaine.", support: TXT_LOUP, source: "Jean de La Fontaine, « Le Loup et l’Agneau », Fables, livre I, 1668.",
        modele: "**Introduction** : Jean de La Fontaine (1621-1695) publie ses Fables à partir de 1668 ; il y met en scène des animaux pour critiquer la société de son temps. Dans « Le Loup et l’Agneau », un loup affamé accuse un agneau avant de le dévorer. Nous verrons d’abord un récit vivant et théâtral, puis une leçon critique sur la loi du plus fort.\n\n**I. Un récit vivant et théâtral**\n• Une mise en scène rapide : le **présent de narration** « Un Loup survient » (v. 5) rend la scène immédiate ; les vers de longueurs variées donnent du rythme.\n• Un dialogue comme au théâtre : les tirets et les répliques opposent un loup agressif (« animal plein de rage », v. 8 ; menaces « Tu seras châtié », v. 9) et un agneau poli (« Sire », « Votre Majesté », v. 10).\n• Des personnages contrastés : l’agneau raisonne avec logique (« Plus de vingt pas au-dessous d’Elle », v. 15 ; « si je n’étais pas né ? », v. 20), le loup accumule des accusations absurdes (« c’est donc ton frère », v. 22).\n\n**II. Une leçon critique sur la loi du plus fort**\n• Une morale annoncée dès le début : « La raison du plus fort est toujours la meilleure » (v. 1) ; le récit va le « montrer ».\n• Un faux procès : le loup cherche des prétextes ; chaque argument de l’agneau est vrai, mais inutile : la force l’emporte sur la justice.\n• Une chute brutale : « Le Loup l’emporte, et puis le mange, / Sans autre forme de procès » (v. 28-29) : ces vers courts et secs dénoncent l’injustice des puissants qui se donnent l’apparence du droit.\n\n**Conclusion** : sous la forme plaisante d’une fable, La Fontaine critique les puissants de son temps qui écrasent les faibles. La morale reste actuelle : la force sans justice est tyrannie. On peut rapprocher cette fable des contes africains où le lièvre, petit et rusé, triomphe par l’intelligence." }
    ] }

  sample: null, depuis: null, attente: [], envoi: null, syncEnCours: false, derniereSync: null,
  init() {

    this.chargerCache();

      const c = JSON.parse(localStorage.getItem(this.cleCache()) || "null");

        for (const coll of COLLECTIONS) S[coll] = new Map((c.docs[coll] || []).map((d) => [d.id, d]));

  },
  sauverCache() {
    try {
      const docs = {};

      localStorage.setItem(this.cleCache(), JSON.stringify({ config: S.config, docs, depuis: this.depuis }));
      localStorage.setItem(this.cleAttente(), JSON.stringify(this.attente));
    } catch (e) { /* stockage plein ou indisponible : la synchro en ligne continue */ }
  },
  async rpc(nom, args) {
    const r = await fetch(`${SUPABASE.url}/rest/v1/rpc/${nom}`, {
      method: "POST", headers: { apikey: SUPABASE.cle, "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(args)

    if (!r.ok) {
      let msg = ""; try { const j = await r.json(); msg = j.message || ""; } catch (e) { /* ignoré */ }

      S.sync = /introuvable/.test(e.message || "") ? "inconnu" : (e.status ? "erreur" : "horsligne");

        const a = this.attente[0];

          if (a.op === "set") await this.rpc("carnet_ecrire", { p_cle: CLE_CARNET, p_coll: a.coll, p_doc: a.id, p_data: a.data });

/* ---------- Chrono d’activité (pause quand on quitte l’appli) ---------- */
class Chrono {
  constructor() { this.acc = 0; this.t0 = null; this.sorties = 0; this.decroches = 0; this.cache = null; this.manuel = false; this.surRetour = null; this._vis = this._vis.bind(this); this.debut = Date.now(); }
  demarrer() { if (this.t0 == null) this.t0 = performance.now(); document.addEventListener("visibilitychange", this._vis); }
  pauser() { if (this.t0 != null) { this.acc += performance.now() - this.t0; this.t0 = null; } }
  reprendre() { if (this.t0 == null) this.t0 = performance.now(); }
  _vis() {
    if (document.hidden) {
      if (this.t0 != null && !this.manuel) { this.pauser(); this.cache = Date.now(); this.sorties++; }
    } else if (this.cache) {
      const absent = Date.now() - this.cache; this.cache = null; this.reprendre();
      if (absent >= 45000 && this.surRetour) this.surRetour(absent);
    }
  }
  crediter(ms) { this.acc += ms; }
  ms() { return this.acc + (this.t0 != null ? performance.now() - this.t0 : 0); }
  minutes() { return Math.round(this.ms() / 60000); }
  arreter() { this.pauser(); document.removeEventListener("visibilitychange", this._vis); }
}
async function demanderRetour(chrono, absentMs) {
  const min = Math.max(1, Math.round(absentMs / 60000));
  const v = await dialogue({
    titre: `Tu as quitté l’appli pendant ${pluriel(min, "minute")}`,
    texte: "Le chrono s’est mis en pause. C’était pour réviser (cahier, manuel, exercice sur papier) ?",
    boutons: [
      { label: "Oui, c’était du travail : compte ce temps", valeur: "travail", cls: "primaire" },
      { label: "Non, autre chose : ne compte pas ce temps", valeur: "decroche" }
    ]
  });
  if (v === "travail") chrono.crediter(absentMs);
  else chrono.decroches++;
}

  try { localStorage.setItem("c1d.chapSoirMat", JSON.stringify(memo)); } catch (e) { /* ignoré */ }
  planifierRendu();
}

const ROLES_BLOC = {
  sciences: { nom: "Comprendre et s’entraîner", detail: "fiche, cartes, exercice corrigé, quiz" },
  lettres: { nom: "Apprendre et rédiger", detail: "cartes, quiz, explique-le, rédaction" },
  langue: { nom: "Vocabulaire et grammaire", detail: "cartes, quiz, exercice corrigé" }
};
const matieresActives = () => Object.keys(MATIERES).filter((m) => epreuveActive(m) && CHAPITRES.some((c) => c.mat === m && chapitreActif(c)));
// Une matière sans chapitre (la PCT, en attente du cahier) n’apparaît ni dans les révisions ni dans le suivi des chapitres
const aDuContenu = (m) => CHAPITRES.some((c) => c.mat === m);
function matieresDuSoir(nb) {
  const auj = todayKey();
  const actives = matieresActives();
  const score = (m) => { const der = derniereSeanceMat(m); const depuis = der ? daysBetween(der, auj) : 10; return poidsMatiere(m) * (Math.min(depuis, 7) + 0.5); };
  const tri = actives.slice().sort((a, b) => score(b) - score(a));
  const urgentes = actives.filter((m) => urgence(m) >= 3);
  const fixe = actives.includes("maths") && urgence("maths") >= 1 ? ["maths"] : [];
  return [...new Set([...urgentes, ...fixe, ...tri])].slice(0, nb);
}
// La liste des matières du soir est fixée pour la journée : elle ne bouge pas quand un bloc est fini
function matieresMemo(nb) {
  const auj = todayKey();
  let memo = null;
  try { memo = JSON.parse(localStorage.getItem("c1d.matSoir") || "null"); } catch (e) { memo = null; }
  const actives = matieresActives();
  if (memo && memo.date === auj && memo.nb === nb && Array.isArray(memo.mats) && memo.mats.length && memo.mats.every((m) => actives.includes(m))) return memo.mats;
  const mats = matieresDuSoir(nb);
  try { localStorage.setItem("c1d.matSoir", JSON.stringify({ date: auj, nb, mats })); } catch (e) { /* ignoré */ }
  return mats;
}
function changerMatiere(k) {
  const nb = nbBlocsDuJour(); const mats = matieresMemo(nb).slice();
  const actives = matieresActives();
  const libres = actives.filter((m) => !mats.includes(m));
  if (!libres.length || k >= mats.length) { toast("Pas d’autre matière disponible."); return; }
  const ordre = Object.keys(MATIERES);
  const apres = libres.filter((m) => ordre.indexOf(m) > ordre.indexOf(mats[k]));
  mats[k] = (apres[0] || libres[0]);
  try { localStorage.setItem("c1d.matSoir", JSON.stringify({ date: todayKey(), nb, mats })); } catch (e) { /* ignoré */ }
  planifierRendu();
}
// Un bloc = une file d’activités, puis des révisions en boucle jusqu’à la fin des 25 min
function planSeance(nb) {
  nb = nb || nbBlocsDuJour();
  const blocs = [];
  matieresMemo(nb).forEach((mat, k) => {
    const X = chapitreDuSoirMat(mat); if (!X) return;
    const role = TYPE_MAT[mat] || "lettres";
    const autres = classementMat(mat).filter((c) => c.id !== X.id).slice(0, 2).map((c) => c.id);
    const aExo = (EXOS[X.id] || []).length > 0;
    const fiche = X.fiche && X.fiche.length && maitriseDe(X.id) < 2 ? [["fiche", X.id]] : [];
    let file;
    if (role === "sciences") file = [...fiche, ["cartes", X.id], aExo ? ["exo", X.id] : ["explique", X.id], ["quiz", X.id]];
    else if (role === "langue") file = [["cartes", X.id], ["quiz", X.id], aExo ? ["exo", X.id] : ["explique", X.id]];
    else file = [...fiche, ["cartes", X.id], ["quiz", X.id], ["explique", X.id], ...(aRedaction(X.id) && maitriseDe(X.id) >= 2 ? [["exercice", X.id]] : aExo ? [["exo", X.id]] : [])];
    if (k === 0) file.unshift(["dues"]);
    if (k === 1) file.unshift(["erreurs"]);
    blocs.push({ role, mat, chap: X.id, file, revisions: [X.id, ...autres], court: MATIERES[mat].nom, titre: `${MATIERES[mat].nom} · ${ROLES_BLOC[role].nom}` });
  });
  return { nb: blocs.length, blocs, duree: dureeSeance(blocs.length) };
}

/* ---------- Échéances ---------- */
function prochainDevoir() {
  const auj = todayKey();
  const liste = Object.keys(MATIERES).filter(epreuveActive).map((m) => ({ m, d: dateDevoir(m) })).filter((x) => x.d && x.d >= auj).sort((a, b) => a.d.localeCompare(b.d));
  if (!liste.length) return null;
  const d = liste[0].d;
  return { date: d, mats: liste.filter((x) => x.d === d).map((x) => x.m), liste };
}
function prochaineEcheance() {
  const auj = todayKey();
  const toutes = DATES_CLES.map((d) => ({ ...d })).concat((S.config.echeances || []).map((e) => ({ date: e.date, titre: e.titre, type: "perso" })));
  return toutes.filter((d) => (d.fin || d.date) >= auj).sort((a, b) => a.date.localeCompare(b.date))[0] || null;
}

/* ---------- Quiz ----------
   Pièges serrés (dates proches, acteurs du même camp, notions qui se ressemblent).
   Une date ou un nom réussi deux fois de suite en QCM revient sans propositions : il faut l’écrire. */
function actQuiz(zone, p, ctx) {
  const ch = CHAP[p.chap];
  const pieges = { maths: "résultats proches et méthodes qui se ressemblent", pct: "formules, unités et signes qui se ressemblent", svt: "notions et exemples qui se ressemblent", francais: "procédés et figures de style qui se ressemblent", anglais: "words and grammar that look alike", philo: "auteurs et notions à ne pas confondre", hg: "pays, routes et ports à ne pas confondre" }[ch.mat] || "réponses qui se ressemblent";
  const preparer = (x) => {
    if (aEcrire(x)) return { x, ecrit: true };
    const choix = choixQuestion(x);
    return { x, ecrit: false, choix, bonne: choix.indexOf(x.t === "v" ? fmtNombre(x.r) : String(x.r)) };
  };
  const lancer = () => {
    const qs = choisirQuestions(ch.id);
    if (!qs.length) {
      vider(zone).append(h("div", { class: "vide" }, icone("quiz"), h("b", null, "Pas encore de questions pour ce chapitre."), h("p", { class: "sous" }, "Ajoute des cartes au chapitre : elles serviront de questions.")),
        h("button", { class: "btn grand primaire", type: "button", onclick: () => ctx.fini({ type: "quiz", chap: ch.id, n: 0, ok: 0, resume: "Quiz : aucune question" }) }, ctx.libelleSuite || "Terminer"));
      return;
    }
    jouer(qs.map(preparer));
  };
  const lancerIA = async () => {
    vider(zone).append(chargement("Claude prépare 6 questions…"));
    const deja = cartesDuChap(ch.id).map((c) => c.recto).join(" ; ");
    const prompt = `Tu es professeur de ${MATIERES[ch.mat].long} ${NIVEAU_IA}. Crée un quiz de 6 questions à choix multiple sur le chapitre « ${ch.titre} ». Notions du cours à couvrir en priorité : ${deja}.
Règles : niveau du devoir, conforme au programme, une seule bonne réponse par question, 4 propositions très proches les unes des autres (dates voisines, acteurs du même camp, notions qui se ressemblent) et de longueur comparable, une explication de 1 à 2 phrases. Tutoie l’élève dans les explications. Pas de question piège sur des détails hors programme.
Réponds uniquement avec un objet JSON valide de la forme : {"questions":[{"q":"...","choix":["...","...","...","..."],"bonne":0,"explication":"..."}]}`;
    try {
      const r = await demanderJSON(prompt);
      const qs = (r.questions || []).filter((q) => q && q.q && Array.isArray(q.choix) && q.choix.length >= 2 && Number.isInteger(q.bonne) && q.bonne >= 0 && q.bonne < q.choix.length).slice(0, 8);

    }

    const afficher = () => {

        if (passe) passages++;
        const rep = x.t === "v" ? fmtNombre(x.r) + (x.u ? " " + x.u : "") : String(x.r);
        const titre = juste
          ? (exact ? "Bonne réponse." : x.t === "d" ? `Accepté, mais retiens ${rep}.` : x.t === "v" ? `Accepté. Valeur exacte : ${rep}.` : `Accepté. Orthographe exacte : ${rep}.`)
          : (q.ecrit ? `${q.saisie ? "Raté." : "À apprendre."} La réponse : ${rep}.` : "Raté.");
        const bouton = h("button", { class: "btn primaire", type: "button", onclick: suivant }, i + 1 < questions.length ? "Question suivante" : "Voir le résultat");
        expl.append(
          h("p", { class: "retour-q" }, h("b", null, rich(titre)), x.e ? [" ", rich(x.e)] : ""),
          passe ? h("p", { class: "petit" }, "Deux fois de suite : la prochaine fois, plus de propositions, il faudra l’écrire.") : null,
          bouton);
        bouton.focus({ preventScroll: true });
        try { bouton.scrollIntoView({ block: "nearest" }); } catch (e) { /* ignoré */ }
      };
      vider(zone).append(
        h("div", { class: "compteur" }, h("span", null, `Question ${i + 1} sur ${questions.length}`), h("span", { class: "tnum" }, `${score} bonne${score > 1 ? "s" : ""}`)),
        h("div", { class: "flash quiz-q" },
          q.ecrit ? h("div", { class: "puces" }, h("span", { class: "puce bac" }, x.t === "d" ? "Sans propositions : écris l’année" : x.t === "v" ? "Sans propositions : écris le résultat" : "Sans propositions : écris la réponse")) : null,
          h("div", { class: "q" }, rich(x.q))));

      const terminer = (juste, exact, saisie) => {

        champ.disabled = true; bValider.disabled = true; bPasse.disabled = true;

    const finir = () => {

      vider(zone).append(
        h("div", { class: "tampon-zone" },

          h("p", null, score === n ? "Sans faute." : score >= n * 0.7 ? "Solide. Les ratées reviendront en premier au prochain quiz." : "Pas encore su. Les ratées reviendront en premier au prochain quiz."),
          passages ? h("p", { class: "sous" }, `${pluriel(passages, "question")} ${passages > 1 ? "passent" : "passe"} à l’écrit : au prochain quiz, plus de propositions.`) : null),

            h("span", null, rich(c.q.x.q), h("span", { class: "petit", style: "display:block" }, "Réponse : ", rich(c.q.x.t === "v" ? fmtNombre(c.q.x.r) : String(c.q.x.r))))))) : null,
        h("button", { class: "btn grand primaire", type: "button", onclick: () => {

/* ---------- Rédaction type devoir (philo, français, histoire-géo, anglais) ---------- */
function actExercice(zone, p, ctx) {
  const ch = CHAP[p.chap];
  const typesPossibles = Object.entries(EXERCICES).filter(([, x]) => x.mat === ch.mat);
  let typeId = p.exo && EXERCICES[p.exo] && EXERCICES[p.exo].mat === ch.mat ? p.exo : null;
  const etat = { sujet: null, document: "", reponse: "" };
  const sujetsDe = (x, c) => (c.sujets || []).filter((s) => s.type === x.sujetType);

  const choisirType = () => {
    const avecSujets = typesPossibles.filter(([, x]) => CHAPITRES.some((c) => c.mat === ch.mat && sujetsDe(x, c).length));
    if (avecSujets.length === 1) { typeId = avecSujets[0][0]; return choisirSujet(); }
    vider(zone).append(h("p", null, "Quel entraînement ?"),
      h("div", { class: "pile" }, (avecSujets.length ? avecSujets : typesPossibles).map(([id, x]) => h("button", { class: "btn grand", type: "button", style: "justify-content:flex-start;text-align:left", onclick: () => { typeId = id; choisirSujet(); } },
        h("span", { class: "pile", style: "gap:2px" }, h("b", null, x.nom), h("span", { class: "petit" }, `${x.desc} Environ ${x.duree} min.`))))));
  };

  const choisirSujet = () => {
    const x = EXERCICES[typeId];
    const banque = sujetsDe(x, ch);
    const autres = CHAPITRES.filter((c) => c.mat === ch.mat && c.id !== ch.id).flatMap((c) => sujetsDe(x, c).map((s) => ({ ...s, chap: c.id })));
    if (p.direct && (banque.length || autres.length)) {
      const tous = [...banque, ...autres];
      const faits = new Set([...S.exercices.values()].map((e) => e.sujet));
      return travailler(tous.find((s) => !faits.has(s.texte)) || tous[0]);
    }
    vider(zone).append(
      h("p", null, h("b", null, x.nom), " · choisis un sujet"),
      h("div", { class: "pile" },
        banque.map((s) => h("button", { class: "btn", type: "button", style: "justify-content:flex-start;text-align:left", onclick: () => travailler(s) }, s.texte)),
        !banque.length && !autres.length ? h("p", { class: "sous" }, "Pas encore de sujet pour ce chapitre.") : null,
        autres.length ? h("details", { class: "repli", open: !banque.length }, h("summary", null, "Sujets d’autres chapitres"),

/* ---------- Exercice corrigé pas à pas (maths, PCT, SVT, anglais…) ----------
   L’énoncé, puis chaque question : chercher sur sa feuille, un indice si besoin, le corrigé,
   et une auto-évaluation honnête. Les questions ratées peuvent aller au carnet d’erreurs. */
function exoSuivant(chapId) {
  const liste = EXOS[chapId] || [];
  if (!liste.length) return null;
  const etat = (e) => S.progres.get("x." + e.id) || null;
  const jamais = liste.filter((e) => !etat(e));
  if (jamais.length) return jamais.slice().sort((a, b) => (a.niveau || 1) - (b.niveau || 1))[0];
  return liste.slice().sort((a, b) => (etat(a).note - etat(b).note) || String(etat(a).last).localeCompare(String(etat(b).last)))[0];
}
function actProbleme(zone, p, ctx) {
  const ch = CHAP[p.chap];
  const liste = EXOS[ch.id] || [];
  const etatX = (e) => S.progres.get("x." + e.id) || null;
  const etoiles = (n) => "★".repeat(n || 1) + "☆".repeat(3 - (n || 1));
  const choisir = () => {
    if (!liste.length) {
      vider(zone).append(h("div", { class: "vide" }, icone("stylo"), h("b", null, "Pas encore d’exercice corrigé pour ce chapitre.")),
        h("button", { class: "btn grand primaire", type: "button", onclick: () => ctx.fini({ type: "probleme", chap: ch.id, resume: "Pas d’exercice" }) }, ctx.libelleSuite || "Terminer"));
      return;
    }
    vider(zone).append(h("p", null, "Quel exercice ? Les étoiles indiquent la difficulté."),
      h("div", { class: "pile" }, liste.map((e) => {
        const st = etatX(e);
        return h("button", { class: "btn grand", type: "button", style: "justify-content:flex-start;text-align:left", onclick: () => lancer(e) },
          h("span", { class: "pile", style: "gap:2px" }, h("b", null, e.titre),
            h("span", { class: "petit" }, `${etoiles(e.niveau)} · environ ${e.duree} min · ${pluriel(e.questions.length, "question")}${st ? ` · déjà fait : ${fmtNote(st.note)}/20` : ""}`)));
      })));
  };
  const lancer = (e) => {
    const rep = e.questions.map(() => null); // 2 = juste, 1 = à moitié, 0 = fausse
    let i = 0;
    const montrer = () => {
      const q = e.questions[i];
      const aide = h("div", { class: "pile", "aria-live": "polite" });
      const actions = h("div", { class: "pile" });
      const voirCorrige = () => {
        aide.append(
          h("div", { class: "corrige" }, h("div", { class: "petit", style: "font-weight:700;margin-bottom:4px" }, "Corrigé"), rich(q.corrige)),
          q.retenir ? bandeau("info", h("b", null, "À retenir : "), rich(q.retenir)) : null);
        vider(actions).append(h("p", null, h("b", null, "Ta réponse sur ta feuille était…")),
          h("div", { class: "segment", style: "grid-template-columns:repeat(3,1fr)" }, [[2, "Juste", 3], [1, "À moitié", 2], [0, "Fausse ou vide", 1]].map(([v, lab, m]) =>
            h("button", { type: "button", "data-m": String(m), onclick: () => { rep[i] = v; i++; if (i < e.questions.length) montrer(); else finir(); } }, h("span", { class: "pt" }), lab))));
        try { aide.scrollIntoView({ block: "nearest" }); } catch (er) { /* ignoré */ }
      };
      vider(zone).append(
        i === 0 || e.questions.length <= 6 ? h("div", { class: "enonce" }, h("div", { class: "petit", style: "margin-bottom:6px;white-space:normal" }, `${MATIERES[ch.mat].nom} · ${e.titre} · ${etoiles(e.niveau)} · environ ${e.duree} min`), rich(e.contexte))
          : h("details", { class: "repli" }, h("summary", null, "Revoir l’énoncé"), h("div", { class: "enonce" }, rich(e.contexte))),
        h("div", { class: "compteur" }, h("span", null, `Question ${i + 1} sur ${e.questions.length}`), h("span", { class: "tnum" }, rep.filter((v) => v === 2).length ? `${rep.filter((v) => v === 2).length} juste${rep.filter((v) => v === 2).length > 1 ? "s" : ""}` : "")),
        h("div", { class: "question-exo" }, rich(q.q)),
        h("p", { class: "petit" }, "Cherche sur ta feuille de brouillon et rédige ta réponse comme au devoir. Ensuite seulement, regarde le corrigé."),
        aide, actions);
      actions.append(h("div", { class: "rangee etire" },
        q.indice ? h("button", { class: "btn", type: "button", onclick: (ev) => { ev.currentTarget.disabled = true; aide.prepend(h("div", { class: "indice" }, h("b", null, "Indice : "), rich(q.indice))); } }, "Un indice") : null,
        h("button", { class: "btn primaire", type: "button", onclick: voirCorrige }, "Voir le corrigé")));

      const note = Math.round((total / (2 * e.questions.length)) * 20 * 2) / 2;
      const coches = e.questions.map((q, k) => ({ q, k, v: rep[k], ok: true })).filter((x) => x.v < 2);
      vider(zone).append(
        h("div", { class: "tampon-zone" }, h("div", { class: "tampon" + (note >= 14 ? " bleu" : "") }, `${fmtNote(note)}/20`),
          h("p", null, note >= 16 ? "Très bien : cet exercice est maîtrisé." : note >= 10 ? "Correct. Refais les questions ratées dans deux jours, sans regarder le corrigé." : "Pas encore. Relis le corrigé ce soir, puis refais l’exercice demain sans regarder.")),
        coches.length ? h("div", { class: "carte" }, h("h3", { class: "h2" }, "Ajouter au carnet d’erreurs ?"),

        h("button", { class: "btn grand primaire", type: "button", onclick: () => {
          coches.filter((c) => c.ok).forEach((c) => ajouterErreur({ mat: ch.mat, chap: ch.id, type: c.q.type || "methode", description: `${e.titre}, question ${c.k + 1} : ${c.q.q}`, aRetenir: String(c.q.retenir || c.q.corrige).slice(0, 700), source: "exercice" }));
          const avant = etatX(e) || {};
          Store.ecrire("progres", "x." + e.id, { exo: true, chap: ch.id, note, last: todayKey(), fois: (avant.fois || 0) + 1 });
          Store.ecrire("exercices", uid(), { date: todayKey(), chap: ch.id, mat: ch.mat, type: "probleme", exo: e.id, sujet: e.titre, note, source: "auto", details: rep });
          ctx.fini({ type: "probleme", chap: ch.id, note, resume: `${e.titre} · ${fmtNote(note)}/20` });
        } }, ctx.libelleSuite || "Enregistrer et terminer"));
    };
    montrer();
  };
  if (p.exo) { const e = liste.find((x) => x.id === p.exo); if (e) return lancer(e); }
  if (p.direct) { const e = exoSuivant(ch.id); if (e) return lancer(e); }
  choisir();
}

/* ---------- Activité seule (depuis Réviser ou un chapitre) ---------- */
function ouvrirActivite(type, params) {
  const chrono = new Chrono();
  let fini = false;
  const p = Object.assign({}, params || {});
  const ctxAct = { chrono, fini: null, libelleSuite: null, surNettoyage: null };
  ouvrirFeuille({
    titre: TITRES_ACT[type] + (p.chap ? " · " + CHAP[p.chap].court : ""),
    avantFermeture: async () => {
      if (fini) return true;
      const min = chrono.minutes();
      if (min >= 1) {
        const v = await dialogue({ titre: "Arrêter l’activité ?", texte: `Tu as travaillé ${fmtMin(min)}. Ce temps sera enregistré.`, boutons: [{ label: "Arrêter et enregistrer", valeur: "oui", cls: "primaire" }, { label: "Continuer", valeur: "non" }] });
        if (v !== "oui") return false;
        chrono.arreter(); fini = true;
        enregistrerSeance({ etapes: [{ type, chap: p.chap, mat: p.mat, resume: "Activité interrompue" }], minutes: min, chrono, origine: "activite" });
        if (ctxAct.surNettoyage) ctxAct.surNettoyage();
        return true;
      }
      chrono.arreter(); if (ctxAct.surNettoyage) ctxAct.surNettoyage();
      return true;
    },
    construire: (f) => {
      chrono.surRetour = (ms) => demanderRetour(chrono, ms);
      if (type !== "minuteur") chrono.demarrer(); else { chrono.demarrer(); chrono.pauser(); }
      ctxAct.chrono = chrono;
      ctxAct.fini = (res) => {
        fini = true; chrono.arreter();
        const min = Math.max(chrono.minutes(), res.minutes || 0);
        enregistrerSeance({ etapes: [{ ...res, chap: res.chap || p.chap }], minutes: min, chrono, origine: "activite" });
        afficherFin(f.corps, min, res.resume, () => f.fermer(true));
      };
      ACTIVITES[type](f.corps, p, ctxAct);
    }
  });
}

/* ============================================================
   LA SÉANCE DU SOIR EN BLOCS
   25 min de travail · 5 min de pause · 25 min… Un bloc ne s’arrête
   pas quand une activité finit : l’appli enchaîne la suivante jusqu’au
   bout des 25 minutes. La séance est enregistrée après chaque bloc et
   reprend là où elle en était si l’appli a été fermée.
   ============================================================ */
const cleSeance = () => "c1d.seance." + (CLE_CARNET || "local");
function lireSeanceEnCours() {
  try {
    const e = JSON.parse(localStorage.getItem(cleSeance()) || "null");
    if (!e || e.v !== 1 || e.phase === "fini" || e.phase === "avant") return null;
    if (e.date !== todayKey() && Date.now() - (e.maj || 0) > 6 * 3600000) return null; // séance d’un autre jour
    return e;
  } catch (er) { return null; }
}
const oublierSeance = () => { try { localStorage.removeItem(cleSeance()); } catch (e) { /* ignoré */ } };

/* Petit signal sonore (et vibration sur Android) à la fin d’un bloc et d’une pause */
let sonCtx = null;
function preparerSon() {
  try { if (!sonCtx) sonCtx = new (window.AudioContext || window.webkitAudioContext)(); if (sonCtx.state === "suspended") sonCtx.resume(); } catch (e) { sonCtx = null; }
}
function bip(n) {
  try { if (navigator.vibrate) navigator.vibrate([220, 120, 220]); } catch (e) { /* ignoré */ }
  if (!sonCtx || document.hidden) return;
  try {
    const t = sonCtx.currentTime;
    for (let k = 0; k < (n || 2); k++) {
      const o = sonCtx.createOscillator(), g = sonCtx.createGain(), t0 = t + k * 0.35;
      o.frequency.value = 880; o.connect(g); g.connect(sonCtx.destination);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
      o.start(t0); o.stop(t0 + 0.3);
    }
  } catch (e) { /* ignoré */ }
}

function lancerSoiree(opts) {

  let etat = opts.reprise || null;
  if (!etat) {
    const nb = nbBlocsDuJour();
    const faits = blocsFaitsDuJour(todayKey());
    const bonus = !!opts.bonus || faits >= nb;
    const plan = planSeance(bonus ? 1 : nb);
    const tous = bonus ? plan.blocs : plan.blocs.slice(Math.min(faits, plan.blocs.length - 1));
    if (!tous.length) { toast("Aucune matière à réviser : coche tes matières dans l’onglet Plus."); return; }
    const blocs = tous.slice(0, blocsPossibles(tous.length));
    if (!blocs.length) { toast(`Trop tard pour un bloc ce soir : ferme l’écran, au lit à ${fmtHM(heureCoucher())}.`); planifierRendu(); return; }
    if (!(S.config.rythme || {}).debut) majConfig({ rythme: Object.assign({}, S.config.rythme, { debut: todayKey() }) });
    etat = {
      v: 1, id: uid(), date: todayKey(), debut: Date.now(), maj: Date.now(), bonus,
      plan: { nb: blocs.length, blocs }, iBloc: 0, phase: "avant", iFile: 0, kRempl: 0,
      msBlocs: [], msEnCours: 0, pauses: [], pauseDebut: null, resultats: [],
      duesFait: false, encours: null, derniere: null, sorties: 0, decroches: 0, quitteA: null

function formRythme() {

    majDebut();
    f.corps.append(
      h("p", null, `Chaque bloc dure ${DUREE_BLOC} minutes, avec ${DUREE_PAUSE} minutes de pause entre deux. Dans un bloc, le carnet enchaîne les activités jusqu’au bout du temps.`),
      h("label", { class: "champ" }, "Nombre de blocs chaque soir", h("span", { class: "aide" }, "Jusqu’au devoir, 3 blocs est un bon rythme. Un soir chargé, mieux vaut 2 blocs faits que 4 abandonnés.")),
      choixUnique([[2, "2 blocs · 55 min"], [3, "3 blocs · 1 h 25"], [4, "4 blocs · 1 h 55"]], mode, (v) => { mode = Number(v); majDebut(); }),

      choixUnique(COUCHERS.map((c) => [c, fmtHM(Number(c.slice(0, 2)) * 60 + Number(c.slice(3)))]), coucher, (v) => { coucher = v; majDebut(); }),
      debutMax,
      h("button", { class: "btn grand primaire", type: "button", onclick: () => {
        majConfig({ rythme: { mode, debut: (S.config.rythme || {}).debut || todayKey() }, coucher });

  } });
}

async function copierDonnees() {
  const data = { config: S.config };
  for (const c of COLLECTIONS) data[c] = [...S[c].values()];
  const txt = JSON.stringify(data, null, 1);
  try { await navigator.clipboard.writeText(txt); toast("Données copiées : colle-les dans un fichier pour les garder."); }
  catch (e) { toast("La copie a été refusée par le navigateur."); }
}
